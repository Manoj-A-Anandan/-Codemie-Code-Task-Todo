<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A focused local todo list." />
    <title>Daymark | Todo List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="masthead">
        <p class="eyebrow">YOUR DAILY MARK</p>
        <h1>Make room for what matters.</h1>
        <p class="intro">A small, quiet place to put today's work in order.</p>
      </header>

      <section class="todo-card" aria-labelledby="todo-heading">
        <div class="card-heading">
          <h2 id="todo-heading">Today's list</h2>
          <p id="task-count" aria-live="polite"></p>
        </div>
        <form id="todo-form" class="todo-form">
          <label class="sr-only" for="todo-input">New task</label>
          <input id="todo-input" name="title" maxlength="120" placeholder="What needs your attention?" required autocomplete="off" />
          <button type="submit">Add task</button>
        </form>
        <div class="list-bar">
          <button class="filter is-active" type="button" data-filter="all">All</button>
          <button class="filter" type="button" data-filter="active">Active</button>
          <button class="filter" type="button" data-filter="completed">Done</button>
          <button id="clear-completed" class="text-button" type="button">Clear completed</button>
        </div>
        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
        <p id="empty-state" class="empty-state">Your list is clear. Add one meaningful task.</p>
      </section>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
